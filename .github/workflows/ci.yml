name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, dependency-free: core unit tests + the IoT (no-OpenCV) build.
  core-and-iot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ linux-libc-dev
      - name: Configure (IoT, no OpenCV)
        run: cmake -B build -DWITH_OPENCV=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # Full desktop build with the OpenCV webcam/RTSP backend.
  full-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libopencv-dev
      - name: Install OpenCV (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv cmake
      - name: Configure
        run: cmake -B build -DWITH_OPENCV=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
