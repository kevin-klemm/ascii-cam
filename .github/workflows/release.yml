name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tiny, OpenCV-free binary to drop on Linux IoT targets.
          - os: ubuntu-latest
            name: linux-x86_64-iot
            opencv: "OFF"
          # Full desktop builds with webcam/RTSP support.
          - os: ubuntu-latest
            name: linux-x86_64
            opencv: "ON"
          - os: macos-latest
            name: macos-arm64
            opencv: "ON"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ linux-libc-dev
          if [ "${{ matrix.opencv }}" = "ON" ]; then sudo apt-get install -y libopencv-dev; fi

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ${{ matrix.opencv == 'ON' && 'opencv' || '' }}

      - name: Configure
        run: cmake -B build -DWITH_OPENCV=${{ matrix.opencv }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          DIST="asciicam-${{ matrix.name }}"
          mkdir -p "$DIST"
          cp build/asciicam "$DIST/"
          cp ascii.conf README.md LICENSE "$DIST/"
          tar -czf "$DIST.tar.gz" "$DIST"
          shasum -a 256 "$DIST.tar.gz" > "$DIST.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: asciicam-${{ matrix.name }}
          path: |
            asciicam-${{ matrix.name }}.tar.gz
            asciicam-${{ matrix.name }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
