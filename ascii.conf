# ascii.conf - configuration for asciicam
# Lines starting with '#' are ignored. Format: key = value

# --- source ---------------------------------------------------------------
# The backend is chosen from the form of this value:
#   0, 1, ...            webcam index (OpenCV; or /dev/videoN when built w/o it)
#   rtsp://... http://   network stream via OpenCV
#   /path/to/file.mp4    file via OpenCV
#   /dev/video0          direct V4L2 capture (Linux, no OpenCV) - IoT targets
#   pipe:yuyv:1280x720   raw YUYV frames on stdin (feed any encoder via ffmpeg)
#   pipe:bgr:640x480     raw BGR24 frames on stdin
source = 0
# rtsp example:  source = rtsp://user:pass@192.168.1.50:554/stream1
# encoder feed:  ffmpeg -i rtsp://cam/stream -f rawvideo -pix_fmt yuyv422 - \
#                  | asciicam ascii.conf pipe:yuyv:1280x720

# --- capture frame size ---------------------------------------------------
width  = 640
height = 480

# Force an output framerate. 0 = take it from the stream.
fps = 0

# --- output grid ----------------------------------------------------------
# 0 = auto-detect from the current terminal window.
cols = 0
rows = 0

# --- image adjustment -----------------------------------------------------
contrast   = 1.1
brightness = 0
reverse    = 0      # 1 = invert brightness -> charset
color      = 1      # 1 = truecolor foreground from chroma
dither     = 0      # 1 = Floyd-Steinberg
edge       = 0      # 1 = Sobel edge detection
edge_threshold = 0  # 0 = raw magnitude, >0 = binary edge cutoff

# --- charset (darkest -> lightest). Quotes preserve leading spaces. -------
charset = " .:-=+*#%@"
# denser ramp:
# charset = " .'`^,:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$"
